name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04   # figé : Playwright 1.56 n'est pas garanti sur Ubuntu 26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Dépendances
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libreoffice-calc fonts-liberation fonts-dejavu-core
      - name: Version du tag = version de l'appli
        run: |
          V=$(grep -o 'id="appVer"[^>]*>[^<]*' app/CoffraPlan.html | sed 's/.*>//')
          echo "appli : $V · tag : $GITHUB_REF_NAME"
          [ "$V" = "$GITHUB_REF_NAME" ]
      - name: Tests (toutes les suites)
        run: python tests/run.py complet -j 4
      - name: Mode d'emploi
        run: python docs/manuel/build.py
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          cp app/CoffraPlan.html "CoffraPlan_v$V.html"
          awk -v v="## $GITHUB_REF_NAME" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          F=("CoffraPlan_v$V.html" "docs/manuel/CoffraPlan_v${V}_Mode_emploi.pdf")
          # Release déjà créée à la main (tag créé depuis le site GitHub, par ex. sur téléphone) : on la complète
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${F[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "CoffraPlan $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${F[@]}" --title "CoffraPlan $GITHUB_REF_NAME" --notes-file notes.md
          fi
